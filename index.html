<style>
:root{
  --ink:#0b0b0b; --yellow:#ffd60a; --red:#e8291c; --green:#007a4d; --blue:#1d3fa8; --cut:#ff4fa3;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0; min-height:100vh; background:#141414; color:#fff; font-family:var(--body); font-weight:500; font-size:1.05rem; line-height:1.45;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px); background-size:18px 18px;
  padding:0 0 env(safe-area-inset-bottom,0px);
}
.flag{display:flex;height:10px;padding-top:env(safe-area-inset-top,0px);box-sizing:content-box}
.flag i{flex:1}
.flag i:nth-child(1){background:var(--green)} .flag i:nth-child(2){background:var(--yellow)} .flag i:nth-child(3){background:#000}
.flag i:nth-child(4){background:#fff} .flag i:nth-child(5){background:var(--red)} .flag i:nth-child(6){background:var(--blue)}
main{max-width:560px;margin:0 auto;padding:36px 20px 28px}
h1,h2,.display{font-family:var(--display);font-style:italic;font-weight:900;margin:0;line-height:.95}
h1{font-size:clamp(3rem,15vw,5rem);letter-spacing:-.01em;transform:rotate(-2deg);margin:6px 0 18px}
h1 span{display:block;color:#fff} h1 span+span{color:var(--yellow)}
h1::after{content:"";display:block;width:70%;height:9px;background:var(--red);transform:skewX(-30deg);margin-top:10px}
.logo{display:block;width:min(320px,80%);height:auto;margin:0 0 14px;transform:rotate(-2deg)}
.intro{display:flex;align-items:center;gap:16px;margin:0 0 30px}
.avatar{flex:none;width:72px;height:72px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--cut)}
.lede{font-size:1.2rem;max-width:30ch;margin:0}
h2{font-size:2rem;margin-bottom:14px}
section{margin-top:38px}
section[hidden]{display:none}
.stack{display:grid;gap:18px}

/* the sticker: white die-cut edge, thin pink cut line, red underline stroke */
.sticker{
  position:relative;display:block;background:var(--ink);color:#fff;text-decoration:none;overflow:hidden;
  border:4px solid #fff;border-radius:22px 30px 24px 28px;padding:16px 22px 26px;
  box-shadow:0 0 0 2px var(--cut),0 12px 24px rgba(0,0,0,.55);
}
.sticker::after{content:"";position:absolute;left:16px;right:34px;bottom:9px;height:5px;background:var(--red);transform:skewX(-30deg)}
.stack>.sticker:nth-child(odd){transform:rotate(-1deg)} .stack>.sticker:nth-child(even){transform:rotate(1deg)}
a.sticker{transition:transform .12s}
a.sticker:hover{transform:rotate(0) scale(1.02)} a.sticker:active{transform:scale(.98)}
.sticker .t{font-family:var(--display);font-style:italic;font-weight:900;font-size:1.9rem;line-height:1;display:block}
.sticker .n{display:block;margin-top:4px;font-size:.98rem;opacity:.85}
.sticker.primary{background:var(--yellow);color:#000}
.sticker.primary::after{background:#000}
.sticker.has-icon{display:flex;align-items:center;gap:14px}
.sticker .txt{min-width:0}
.ico{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#000}
.ico svg{width:26px;height:26px;fill:currentColor}
.primary .ico{background:#000;color:var(--yellow)}

.offer .t{color:var(--yellow)}
.code-row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.code{font-family:var(--display);font-style:italic;font-weight:900;font-size:2.2rem;letter-spacing:.04em;color:#fff;border:3px dashed var(--yellow);padding:2px 14px;border-radius:10px}
button{font:inherit;cursor:pointer}
.btn{font-family:var(--display);font-style:italic;font-weight:900;font-size:1.3rem;background:var(--yellow);color:#000;border:0;border-radius:10px;padding:9px 18px}
.btn:active{transform:scale(.97)}

form{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
label{flex:1 0 100%;font-weight:600}
input[type=email]{flex:1 1 200px;min-width:0;font:inherit;color:#fff;background:#000;border:3px solid #fff;border-radius:10px;padding:10px 14px}
input::placeholder{color:#9a9a9a}
.status{flex:1 0 100%;margin:0;min-height:1.4em;font-weight:600}

.wall{display:flex;flex-wrap:wrap;gap:12px 10px}
.pill{background:var(--ink);color:#fff;border:3px solid #fff;border-radius:14px 18px 14px 20px;padding:5px 13px 7px;box-shadow:0 0 0 2px var(--cut);font-family:var(--display);font-style:italic;font-weight:900;font-size:1.2rem;line-height:1.05}
.pill:nth-child(3n+1){color:var(--yellow);transform:rotate(-2deg)}
.pill:nth-child(3n+2){transform:rotate(1.5deg)}
.pill:nth-child(3n){color:#ff5a4d;transform:rotate(-1deg)}

a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
footer{max-width:560px;margin:0 auto;padding:6px 20px 36px;font-size:.95rem;opacity:.75}
footer a{color:#fff}
@media (prefers-reduced-motion:reduce){a.sticker,.btn{transition:none}}
</style>
</head>

  youtube: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r="1.1" style="fill:currentColor;stroke:none"/></svg>',

  chat: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H10l-5 4v-4H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>'
};

// Link buttons
CONFIG.links.filter(l => l.url).forEach(l => {
  const hasIcon = !!ICONS[l.icon];
  const a = h("a", "sticker" + (l.primary ? " primary" : "") + (hasIcon ? " has-icon" : ""));
  a.href = l.url; a.target = "_blank"; a.rel = "noopener";
  if (hasIcon) { const i = h("span", "ico"); i.innerHTML = ICONS[l.icon]; a.append(i); }
  const txt = h("div", "txt");
  txt.append(h("span", "t", l.label));
  if (l.note) txt.append(h("span", "n", l.note));
  a.append(txt);
  $("links").append(a);
});

// Offer
if (CONFIG.offer && CONFIG.offer.code) {
  $("offerText").textContent = CONFIG.offer.text;
  $("offerCode").textContent = CONFIG.offer.code;
  $("offer").hidden = false;
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(CONFIG.offer.code); $("copy").textContent = "Copied"; }
    catch (e) { $("copy").textContent = "Select and copy"; }
    setTimeout(() => { $("copy").textContent = "Copy code"; }, 2000);
  });
}

// Email sign-up
if (CONFIG.emailEndpoint) {
  $("signup").hidden = false;
  // Records where the visitor came from, e.g. yourdomain.co.za/?src=qr
  $("source").value = new URLSearchParams(location.search).get("src") || "direct";
  $("form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const email = $("email");
    const status = $("status");
    if (!email.value || !email.checkValidity()) { status.textContent = "Enter a valid email address."; email.focus(); return; }
    status.textContent = "Sending…";
    try {
      const res = await fetch(CONFIG.emailEndpoint, { method: "POST", headers: { Accept: "application/json" }, body: new FormData($("form")) });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        throw Object.assign(new Error(d.errors && d.errors[0] ? d.errors[0].message : ""), { fromServer: true });
      }
      status.textContent = "You’re on the list. Thanks!";
      $("form").reset();
    } catch (e) { status.textContent = (e.fromServer && e.message) || "That didn’t go through. Please try again."; }
  });
}

// Shop
if (CONFIG.products.length) {
  $("shop").hidden = false;
  CONFIG.products.forEach(p => {
    const a = h(p.url ? "a" : "div", "sticker");
    if (p.url) { a.href = p.url; a.target = "_blank"; a.rel = "noopener"; }
    a.append(h("span", "t", p.name + (p.price ? " · " + p.price : "")));
    if (p.note) a.append(h("span", "n", p.note));
    $("products").append(a);
  });
}

// Sticker wall
CONFIG.slogans.forEach(s => $("wall").append(h("span", "pill", s)));
</script>
</body>
</html>
